/* English fonts and the ACRO KKU logo are shared with the ACRO KKU Go homepage (one folder up).
   Thai fonts (Kanit for headings, Noto Sans Thai for text) sit in this folder and load only when Thai is shown. */
@font-face{font-family:"BSD";src:url(../bsd-800.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Manrope";src:url(../manrope-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Manrope";src:url(../manrope-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Manrope";src:url(../manrope-700.woff2) format("woff2");font-weight:700 800;font-display:swap}
@font-face{font-family:"NotoThai";src:url(nst-thai-400.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+02D7,U+0303,U+0331,U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"NotoThai";src:url(nst-latin-400.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"NotoThai";src:url(nst-thai-600.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+02D7,U+0303,U+0331,U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"NotoThai";src:url(nst-latin-600.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"NotoThai";src:url(nst-thai-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+02D7,U+0303,U+0331,U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"NotoThai";src:url(nst-latin-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"KanitTH";src:url(kanit-thai-600.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+02D7,U+0303,U+0331,U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"KanitTH";src:url(kanit-latin-600.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"KanitTH";src:url(kanit-thai-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+02D7,U+0303,U+0331,U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"KanitTH";src:url(kanit-latin-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  /* ACRO KKU Go greens and orange, plus the blues of the previous-round summary */
  --navy:#0F2A6B;--royal:#1D4BB5;--sky:#DCEBFA;--mist:#EAF2FB;
  --forest:#215E33;--emerald:#16944F;--beep:#18B957;--orange:#F0702F;--ember:#E8472B;--peach:#FFD3B8;
  --ink:#13202E;--muted:#55657A;--line:#D3DEEA;--paper:#F3F7FB;
  --grad:linear-gradient(140deg,#0F2A6B 0%,#1D4BB5 44%,#1A8A78 80%,#16944F 100%);
  --body:"Manrope","NotoThai",system-ui,sans-serif;
  --disp:"BSD","Manrope","NotoThai",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
a{color:inherit}
h1,h2,.label,.ttl,.dt,.concl{text-wrap:balance}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left))}

/* ---------- header (same as ACRO KKU Go) ---------- */
.top{background:#fff;border-bottom:6px solid var(--orange)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:68px}
.logo{height:36px;width:auto;display:block}
.top .right{display:flex;align-items:center;gap:14px}
.back{display:inline-flex;align-items:center;gap:6px;font:700 13px/1 var(--body);text-decoration:none;color:var(--navy);background:#fff;border:2px solid var(--navy);padding:8px 11px;white-space:nowrap}
.back:hover,.back:focus-visible{background:var(--navy);color:#fff}
.back .go-full{font-weight:inherit}
@media (max-width:420px){.top .right{gap:8px}.back .go-full{display:none}}
.lang{display:inline-flex;border:2px solid var(--navy)}
.lang button{border:0;background:#fff;color:var(--navy);font:700 13px/1 var(--body);padding:8px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* ---------- hero ---------- */
.hero{background:var(--grad);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-90px;bottom:-110px;width:340px;height:340px;border:2px dashed rgba(255,255,255,.28);border-radius:50%}
.hero .wrap{display:grid;grid-template-columns:1fr;gap:26px;padding-top:34px;padding-bottom:40px;position:relative;z-index:1}
.kicker{font:800 14px/1.35 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--peach)}
.title{font:800 clamp(52px,14.5vw,104px)/.88 var(--disp);text-transform:uppercase;letter-spacing:.005em;margin-top:8px}
.nw{white-space:nowrap}
.title .bang{display:inline-block;background:var(--orange);color:#fff;padding:0 .12em .02em;margin-left:.06em;transform:skewX(-12deg) rotate(-2deg);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.title .bang b{display:inline-block;transform:skewX(12deg);font:800 1em/1 "BSD","Manrope",sans-serif;text-transform:uppercase}
.lead{font-size:17px;font-weight:600;color:rgba(255,255,255,.94);max-width:30em;margin-top:16px}
.tagline{font-size:14px;font-weight:600;color:var(--peach);margin-top:8px}
.facts{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;width:fit-content;max-width:100%;gap:6px 22px;margin-top:22px;background:rgba(255,255,255,.13);
  border-left:4px solid var(--peach);padding:12px 18px 13px;backdrop-filter:blur(2px)}
.facts b{display:block;font:800 40px/.9 var(--disp)}
.facts span{display:block;font-size:12px;font-weight:700;line-height:1.25;color:rgba(255,255,255,.92);margin-top:4px;max-width:6.5em}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:10px;font:800 17px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;
  padding:14px 20px 13px 22px;border:2px solid transparent;cursor:pointer}
.btn svg{transition:transform .15s}
a.btn:hover svg{transform:translateX(4px)}
.btn.white{background:#fff;color:var(--navy)}
.btn.ghost{border-color:rgba(255,255,255,.7);color:#fff;background:transparent}
.btn.orange{background:var(--orange);color:#fff}
.btn.off{background:rgba(255,255,255,.18);color:rgba(255,255,255,.85);cursor:default}

.intake{background:#fff;color:var(--ink);padding:20px 20px 18px;box-shadow:0 18px 40px rgba(8,22,64,.3);align-self:start;position:relative}
.intake::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--orange)}
.chip{display:inline-flex;align-items:center;gap:8px;font:800 13px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--forest);margin-top:4px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--emerald)}
.chip.soon{color:var(--royal)}.chip.soon i{background:var(--royal)}
.chip.closed{color:var(--muted)}.chip.closed i{background:#9AA7B6}
.intake h2{font:800 26px/1.05 var(--disp);text-transform:uppercase;color:var(--navy);margin-top:8px}
.irow{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;padding:12px 0;border-top:1.5px solid var(--line);margin-top:12px}
.irow.first{margin-top:14px}
.irow .n{font:800 40px/.9 var(--disp);color:var(--orange);grid-row:1/span 2}
.irow.alt .n{color:var(--emerald)}
.irow .d{font-weight:700;font-size:16px}
.irow .s{font-size:13px;color:var(--muted)}
.free{display:inline-block;margin-top:6px;background:var(--orange);color:#fff;font:800 15px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;padding:9px 12px 8px}
.nointake{color:var(--muted);font-size:15px;margin-top:8px}

/* countdown */
.cd{margin-top:14px;padding-top:14px;border-top:1.5px solid var(--line)}
.cd-h{display:flex;align-items:center;gap:11px;font:800 13px/1.3 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--forest)}
.cd.closed .cd-h{color:var(--muted)}
.beep{width:12px;height:12px;border-radius:50%;background:var(--beep);flex:none;animation:beep 1.2s ease-out infinite}
@keyframes beep{0%{box-shadow:0 0 0 0 rgba(24,185,87,.8)}70%{box-shadow:0 0 0 14px rgba(24,185,87,0)}100%{box-shadow:0 0 0 0 rgba(24,185,87,0)}}
.beep.off{background:#9AA7B6;animation:none}
.cd-g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.cd-g div{background:var(--mist);border-bottom:4px solid var(--beep);text-align:center;padding:9px 2px 7px}
.cd.closed .cd-g div{border-color:#9AA7B6;opacity:.65}
.cd-g b{display:block;font:800 34px/1 var(--disp);color:var(--navy);font-variant-numeric:tabular-nums}
.cd-g small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.cd-n{font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.5}

/* partners band */
.orgs{background:#fff;border-bottom:1.5px solid var(--line)}
.orgs .wrap{padding-top:22px;padding-bottom:24px}
.orgs-t{font:800 13px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.pts{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 14px}
.pt{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;text-decoration:none;color:var(--navy);padding:0 4px}
.pt .lg{height:76px;width:100%;display:flex;align-items:center;justify-content:center}
.pt img{max-height:76px;max-width:100%;width:auto;height:auto;object-fit:contain;display:block}
.pt span{font-size:12px;font-weight:600;line-height:1.45;color:var(--muted)}

/* ---------- sections ---------- */
main{padding:34px 0 20px;flex:1}
.sec{margin-top:44px}.sec:first-child{margin-top:0}
.label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font:800 15px/1.2 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--navy);
  border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.label .count{font-size:26px;color:var(--orange);letter-spacing:0;line-height:1}
.note{color:var(--muted);font-size:14px;margin:-8px 0 16px}

/* format */
.fmt{display:grid;gap:12px;grid-template-columns:1fr}
.box{padding:22px 22px 20px;border-top:6px solid;position:relative}
.box.on{background:#E3F3EA;border-color:var(--emerald)}
.box.off{background:#FDEBDD;border-color:var(--orange)}
.box .k{font:800 14px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase}
.box.on .k{color:var(--forest)}.box.off .k{color:#B84A12}
.box .big{display:flex;align-items:flex-end;gap:10px;margin-top:10px}
.box .big b{font:800 96px/.8 var(--disp)}
.box.on .big b{color:var(--forest)}.box.off .big b{color:var(--orange)}
.box .big span{font:800 24px/1 var(--disp);text-transform:uppercase;padding-bottom:6px}
.box p{margin-top:12px;font-weight:600;color:var(--ink)}
.plus{display:none}

/* cohorts */
.tl{background:#fff;border:1.5px solid var(--line);padding:16px 16px 14px}
.axis{position:relative;height:40px;border-bottom:2px solid var(--ink)}
.axis .m{position:absolute;top:0;bottom:0;border-left:1.5px solid var(--line);padding:2px 0 0 5px;font-size:12px;font-weight:700;line-height:1.15;overflow:hidden}
.axis .m small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.lanes{position:relative;margin-top:6px}
.lanes .g{position:absolute;top:0;bottom:0;border-left:1.5px solid var(--line)}
.bar{position:absolute;height:38px;display:flex;align-items:center;padding:0 12px;color:#fff;overflow:hidden;white-space:nowrap}
.bar b{font:800 16px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
.cl-0{background:var(--emerald)}.cl-1{background:var(--orange)}.cl-2{background:var(--royal)}.cl-3{background:var(--ember)}
.cgrid{display:grid;gap:12px;margin-top:14px}
.cc{background:#fff;border:1.5px solid var(--line);border-left-width:8px;padding:16px 18px 16px;display:grid;gap:4px}
.cc.cl-0{border-left-color:var(--emerald)}.cc.cl-1{border-left-color:var(--orange)}.cc.cl-2{border-left-color:var(--royal)}.cc.cl-3{border-left-color:var(--ember)}
.cc .no{font:800 15px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--navy)}
.cc .dt{font-weight:700;font-size:21px;line-height:1.25;margin-top:6px}
.cc .meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px;color:var(--muted);margin-top:4px}
.badge{display:inline-block;font:700 12px/1 var(--body);padding:6px 9px;background:var(--mist);color:var(--navy)}
.badge.run{background:#DDF1E5;color:var(--forest)}.badge.done{background:#E8ECF1;color:var(--muted)}

/* brochures */
.bros{display:grid;gap:14px}
.bro{display:grid;grid-template-columns:132px 1fr;gap:16px;background:#fff;border:1.5px solid var(--line);padding:14px}
.bro .thumb{border:0;background:none;padding:0;cursor:zoom-in;display:block;align-self:start}
.bro .thumb img{width:132px;height:auto;display:block;border:1px solid var(--line)}
.bro .bt{display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0}
.bro .ed{font:800 12px/1.3 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--emerald)}
.bro .bn{font-weight:700;font-size:17px;line-height:1.35}
.ba{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.lnk{font:700 14px/1 var(--body);text-decoration:none;color:var(--navy);border:2px solid var(--navy);padding:9px 12px;background:#fff;cursor:pointer;display:inline-block}
.lnk:hover{background:var(--navy);color:#fff}
dialog{border:0;padding:0;background:#fff;max-width:min(94vw,860px);max-height:94vh;margin:auto;overflow:auto}
dialog::backdrop{background:rgba(8,22,64,.78)}
dialog img{display:block;max-width:100%;max-height:82vh;width:auto;height:auto;margin:0 auto}
.lb-x{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;background:var(--navy);color:#fff;font:700 26px/1 var(--body);cursor:pointer}
.lb-b{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:3px solid var(--orange);font-weight:700;font-size:14px}

/* numbered lists (sites, objectives) */
.list{display:grid;gap:12px}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;background:#fff;border:1.5px solid var(--line);padding:18px 18px 18px 16px;
  animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card .num{font:800 46px/.9 var(--disp);color:var(--orange);min-width:1.4em}
.card.blue .num{color:var(--royal)}
.card .ttl{font-weight:700;font-size:16.5px;line-height:1.4;align-self:center}

/* previous round */
.past{background:#fff;border:1.5px solid var(--line);margin-bottom:14px}
.past>summary{list-style:none;cursor:pointer;background:linear-gradient(100deg,var(--navy),var(--royal));color:#fff;padding:16px 18px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.past>summary::-webkit-details-marker{display:none}
.past>summary b{font:800 24px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.past>summary span{font-weight:700;font-size:14px;color:var(--peach)}
.pb{padding:20px 18px 22px;display:grid;gap:26px}
.sh{font:800 14px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--royal);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sh::before{content:"";width:22px;height:4px;background:var(--orange);flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--mist);border-top:5px solid var(--royal);padding:14px 14px 14px}
.stat.orange{border-color:var(--orange)}.stat.green{border-color:var(--emerald)}
.stat b{display:block;font:800 clamp(40px,11vw,58px)/.9 var(--disp);color:var(--royal)}
.stat.orange b{color:var(--orange)}.stat.green b{color:var(--emerald)}
.stat .lb{font:700 13px/1.25 var(--body);margin-top:8px;display:block}
.stat .sb{display:block;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.info{display:grid;gap:0}
.info div{display:grid;gap:2px;padding:10px 0;border-top:1.5px solid var(--line)}
.info div:first-child{border-top:0;padding-top:0}
.info dt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.info dd{font-weight:700}
.ticks{list-style:none;display:grid;gap:10px}
.ticks li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-weight:600}
.ticks svg{margin-top:3px}
.concl{background:linear-gradient(100deg,var(--navy),var(--royal));color:#fff;padding:18px 18px 18px 20px;border-left:6px solid var(--orange);font-weight:600}
.concl b{display:block;font:800 14px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--peach);margin-bottom:8px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal img{width:100%;height:150px;object-fit:cover;display:block}

/* contact band */
.contact{background:var(--navy);color:#fff;margin-top:46px;border-top:6px solid var(--orange)}
.contact .wrap{padding-top:32px;padding-bottom:34px;display:grid;gap:22px}
.contact h2{font:800 34px/1 var(--disp);text-transform:uppercase}
.contact .org{color:rgba(255,255,255,.8);font-size:14px;margin-top:10px;max-width:34em}
.who{background:rgba(255,255,255,.1);border-left:4px solid var(--peach);padding:14px 18px;display:grid;gap:3px}
.who .r{font:800 13px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--peach)}
.who .nm{font-weight:700;font-size:19px;margin-top:4px}
.who a{text-decoration:none;font-weight:600;border-bottom:1.5px solid rgba(255,255,255,.35);justify-self:start;padding-bottom:1px}
.who .sep{border:0;border-top:1px solid rgba(255,255,255,.22);margin:11px 0 8px}
.who .tel{display:flex;flex-wrap:wrap;gap:0 .35em;align-items:baseline}
.who .tel a{border-bottom-width:1.5px}
.who .tel .c{opacity:.8}
.cert{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--orange);padding:14px 18px}
.cert .k{font:800 13px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.cert b{font-weight:700;font-size:17px;color:var(--navy)}
html[lang="th"] .cert .k{font:600 14px/1.4 var(--disp);letter-spacing:0;text-transform:none}
.contact .cta{margin-top:0}

footer{background:#0A1E52;color:#fff;border-top:6px solid var(--orange)}
footer .wrap{padding-top:24px;padding-bottom:calc(26px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-end}
footer .names{display:grid;gap:2px;font-size:14px}
footer .names .th{font-family:"NotoThai",system-ui,sans-serif;font-weight:600;font-size:15px}
footer .names .en{color:rgba(255,255,255,.72)}
footer a.site{color:#fff;font-weight:700;text-decoration:none;border-bottom:2px solid var(--orange);padding-bottom:2px}

.sticky{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:3px solid var(--orange);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -8px 24px rgba(8,22,64,.12)}
.sticky .t{font-weight:700;font-size:14px;line-height:1.3;color:var(--navy)}
.sticky .btn{background:var(--navy);color:#fff;padding:12px 16px 11px;font-size:16px;white-space:nowrap}
body.has-sticky{padding-bottom:70px}
.empty{padding:40px 0;color:var(--muted)}

@media (max-width:420px){.facts{gap:6px 14px;padding:12px 14px 13px}.facts b{font-size:34px}}
@media (min-width:820px){
  .hero .wrap{grid-template-columns:minmax(0,1fr) 380px;gap:20px 52px;padding-top:56px;padding-bottom:64px;align-items:center}
  .title{font-size:clamp(64px,8.4vw,112px)}
  .fmt{grid-template-columns:1fr auto 1fr;align-items:stretch;gap:0}
  .plus{display:flex;align-items:center;justify-content:center;width:56px;font:800 54px/1 var(--disp);color:var(--ink)}
  .cgrid{grid-template-columns:1fr 1fr}
  .bros{grid-template-columns:1fr 1fr}
  .bro{grid-template-columns:170px 1fr}.bro .thumb img{width:170px}
  .list{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(4,1fr)}
  .pb{padding:26px 26px 28px}
  .pcols{display:grid;grid-template-columns:1fr 1.25fr;gap:34px}
  .pts{grid-template-columns:repeat(6,1fr);gap:14px}
  .contact .wrap{grid-template-columns:1.2fr 1fr;align-items:center;gap:40px}
  .contact .cta{grid-column:1/-1}
  .sticky{display:none}body.has-sticky{padding-bottom:0}
  .gal{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){.card,.beep{animation:none}}

/* =====================================================================
   2026 SKIN: premium look (rounded surfaces, soft depth, pill buttons).
   Sits after the rules above and only restyles; content and logic unchanged.
   ===================================================================== */
:root{--night:#071A45;--r-lg:24px;--r-md:16px;--shadow:0 1px 2px rgba(10,30,80,.06),0 8px 24px rgba(10,30,80,.06);--shadow-hi:0 2px 4px rgba(10,30,80,.06),0 24px 48px rgba(10,30,80,.14);
  --line:rgba(15,42,107,.10);--paper:#F6F8FC;--h:"Manrope","NotoThai",system-ui,sans-serif}
html{scroll-behavior:smooth;scroll-padding-top:130px}
body{-webkit-font-smoothing:antialiased}
.top .wrap{height:66px}
.logo{height:34px}
/* hero */
.hero{background:var(--night);isolation:isolate}
.hero::after{display:none}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(600px 480px at 0% 0%,rgba(29,75,181,.9),transparent 70%),radial-gradient(520px 420px at 100% 100%,rgba(26,138,120,.75),transparent 70%),radial-gradient(380px 300px at 85% 10%,rgba(240,112,47,.35),transparent 70%)}
.hero .wrap{padding-top:40px;padding-bottom:48px}
.hero .wrap::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.3;background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.2px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 80%);mask-image:linear-gradient(180deg,#000,transparent 80%)}
.kicker{display:inline-flex;align-items:center;gap:10px;font:600 13px/1.35 var(--h);letter-spacing:0;text-transform:none;color:rgba(255,255,255,.8);padding:7px 14px 7px 10px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.06)}
.kicker::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:#7FD8A4;box-shadow:0 0 0 4px rgba(127,216,164,.18)}
.title{font:800 clamp(42px,11vw,84px)/.98 var(--h);text-transform:none;letter-spacing:-.035em;margin-top:18px}
.title .bang{border-radius:.08em;background:linear-gradient(135deg,var(--orange),var(--ember));box-shadow:0 14px 34px rgba(232,71,43,.35);font-size:.9em;vertical-align:.04em}
.lead{font-weight:500;color:rgba(255,255,255,.86);font-size:clamp(17px,2.2vw,19px)}
.tagline{color:var(--peach);font-weight:600}
.facts{border:1px solid rgba(255,255,255,.14);border-left:1px solid rgba(255,255,255,.14);border-radius:var(--r-md);background:rgba(255,255,255,.07);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:14px 20px 16px}
.facts span{color:rgba(255,255,255,.75);font-weight:600}
.cta{gap:12px;margin-top:26px}
.btn{border-radius:999px;font:700 16px/1.2 var(--h);letter-spacing:0;text-transform:none;min-height:52px;padding:0 24px;border-width:1px;transition:transform .2s,box-shadow .2s,background .2s}
.btn.white{box-shadow:0 10px 30px rgba(0,0,0,.25)}
a.btn.white:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,.3)}
.btn.ghost{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.04)}
a.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.off{border-radius:999px}
/* intake card */
.intake{border-radius:var(--r-lg);padding:24px 22px 20px;box-shadow:0 30px 80px rgba(3,12,40,.45);overflow:hidden}
.intake::before{height:4px;background:linear-gradient(90deg,var(--emerald),var(--orange))}
.chip{font:700 12.5px/1 var(--h);letter-spacing:0;text-transform:none;padding:7px 11px;border-radius:999px;background:#E6F5EC}
.chip.soon{background:var(--mist)}.chip.closed{background:#EEF1F5}
.intake h2{font:800 24px/1.2 var(--h);letter-spacing:-.02em;text-transform:none;margin-top:12px}
.irow{border-top:1px solid var(--line)}
.free{border-radius:999px;font:700 13px/1 var(--h);letter-spacing:0;text-transform:none;padding:8px 12px}
.cd{border-top:1px solid var(--line)}
.cd-h{font:700 13px/1.35 var(--h);letter-spacing:0;text-transform:none}
.cd-g div{border:0;border-radius:12px;background:var(--mist);position:relative;overflow:hidden;padding:10px 2px 9px}
.cd-g div::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--beep)}
.cd.closed .cd-g div::after{background:#9AA7B6}
.cd-g small{letter-spacing:0}
/* partners */
.orgs{border-bottom:1px solid var(--line)}
.orgs .wrap{padding-top:28px;padding-bottom:30px}
.orgs-t{font:700 12.5px/1 var(--h);letter-spacing:.08em;color:var(--muted)}
.pt img{filter:grayscale(.15);transition:filter .2s,transform .2s}
.pt:hover img{filter:none;transform:scale(1.03)}
/* in-page navigation */
.secnav{position:sticky;top:66px;z-index:20;background:rgba(246,248,252,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.secnav .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}
.secnav .wrap::-webkit-scrollbar{display:none}
.secnav a{flex:none;display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--navy);font:600 13.5px/1 var(--h);text-decoration:none;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.secnav a:hover{border-color:rgba(29,75,181,.35)}
.secnav a.on{background:var(--navy);border-color:var(--navy);color:#fff}
html[lang="th"] .secnav a{font-family:"NotoThai",sans-serif}
/* sections */
main{padding:44px 0 24px}
.sec{margin-top:64px}
.label{border-bottom:0;padding-bottom:0;margin-bottom:22px;font:800 clamp(24px,3.6vw,32px)/1.2 var(--h);letter-spacing:-.025em;text-transform:none;color:var(--ink);align-items:center}
.label .count{font:700 12px/1 var(--h);letter-spacing:.08em;color:var(--royal);background:var(--mist);padding:7px 10px;border-radius:999px}
.note{margin:-12px 0 18px}
.box{border-radius:var(--r-lg);border-top:0;padding:26px 24px 24px;box-shadow:var(--shadow);overflow:hidden}
.box.on{background:linear-gradient(160deg,#E9F7EF,#D8F0E2)}.box.off{background:linear-gradient(160deg,#FFF2E9,#FCE3D2)}
.box .k{font:700 12.5px/1 var(--h);letter-spacing:.08em;display:inline-flex;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.7)}
.box .big span{font:700 22px/1 var(--h);text-transform:none;letter-spacing:-.01em}
.plus{font:300 48px/1 var(--h);color:var(--muted)}
.cert{border-radius:var(--r-md);border:1px solid var(--line);border-left:1px solid var(--line);box-shadow:var(--shadow);padding:16px 20px}
.cert .k{font:700 12px/1 var(--h);letter-spacing:.08em;padding:7px 10px;border-radius:999px;background:#FFF0E7;color:#B4441B}
.tl{border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 18px 16px}
.axis{border-bottom:1px solid rgba(19,32,46,.25)}
.axis .m,.lanes .g{border-left:1px solid var(--line)}
.bar{border-radius:10px}
.bar b{font:700 14px/1 var(--h);letter-spacing:0;text-transform:none}
.cc{border-radius:var(--r-md);border:1px solid var(--line);border-left:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden;padding:18px 20px 18px 24px}
.cc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--emerald)}
.cc.cl-1::before{background:var(--orange)}.cc.cl-2::before{background:var(--royal)}.cc.cl-3::before{background:var(--ember)}
.cc .no{font:700 12.5px/1 var(--h);letter-spacing:.08em;color:var(--royal)}
.badge{border-radius:999px;font-weight:700;padding:6px 10px}
.bro{border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;transition:box-shadow .25s,transform .25s}
.bro:hover{box-shadow:var(--shadow-hi);transform:translateY(-2px)}
.bro .thumb img{border-radius:10px;border:1px solid var(--line)}
.bro .ed{font:700 12px/1.3 var(--h);letter-spacing:.08em}
.lnk{border-radius:999px;border:1px solid rgba(15,42,107,.22);font:700 14px/1 var(--h);height:40px;padding:0 16px;display:inline-flex;align-items:center;transition:background .2s,color .2s}
dialog{border-radius:20px}
.lb-x{border-radius:50%}
.card{border-radius:var(--r-md);border:1px solid var(--line);box-shadow:var(--shadow);animation-fill-mode:backwards;align-items:center}
.card .num{font:800 34px/1 var(--disp);min-width:1.5em}
.past{border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.past>summary{background:var(--night);position:relative;isolation:isolate;padding:20px 22px;transition:background .2s}
.past>summary::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(400px 200px at 100% 0%,rgba(29,75,181,.8),transparent 70%)}
.past>summary::after{content:"";width:10px;height:10px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);margin-left:auto;align-self:center;transition:transform .25s}
.past[open]>summary::after{transform:rotate(-135deg)}
.past>summary b{font:800 21px/1.2 var(--h);letter-spacing:-.015em;text-transform:none}
.sh{font:700 12.5px/1 var(--h);letter-spacing:.08em}
.sh::before{width:18px;height:3px;border-radius:2px}
.stat{border-radius:var(--r-md);border-top:0;position:relative;overflow:hidden;padding:16px}
.stat::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--royal)}
.stat.orange::before{background:var(--orange)}.stat.green::before{background:var(--emerald)}
.info div{border-top:1px solid var(--line)}
.info dt{letter-spacing:.06em}
.concl{border-radius:var(--r-md);border-left:0;background:var(--night);position:relative;overflow:hidden;isolation:isolate;padding:20px 22px}
.concl::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(420px 220px at 100% 100%,rgba(240,112,47,.35),transparent 70%),radial-gradient(420px 220px at 0 0,rgba(29,75,181,.7),transparent 70%)}
.concl b{font:700 12.5px/1 var(--h);letter-spacing:.08em}
.gal img{border-radius:12px}
/* contact + footer */
.contact{background:var(--night);border-top:0;position:relative;isolation:isolate;overflow:hidden;margin-top:72px}
.contact::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(520px 360px at 0% 100%,rgba(29,75,181,.8),transparent 70%),radial-gradient(420px 300px at 100% 0%,rgba(240,112,47,.3),transparent 70%)}
.contact .wrap{padding-top:44px;padding-bottom:44px}
.contact h2{font:800 clamp(28px,4vw,38px)/1.15 var(--h);letter-spacing:-.025em;text-transform:none}
.who{border-left:0;border-radius:var(--r-md);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);padding:18px 20px}
.who .r{font:700 12px/1 var(--h);letter-spacing:.08em}
footer{background:#05122F;border-top:0}
footer .wrap{padding-top:30px;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
footer a.site{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.22);transition:background .2s}
footer a.site:hover{background:rgba(255,255,255,.08)}
/* sticky register bar: only once the hero button has scrolled away */
.sticky{border-top:0;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(8,22,64,.18);transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.sticky.show{transform:none}
.sticky .btn{border-radius:999px;min-height:46px;padding:0 18px;font-size:15px}
html[lang="th"] .title{font:700 clamp(38px,10vw,70px)/1.25 var(--disp);letter-spacing:0}
html[lang="th"] .label{font:600 clamp(22px,3.4vw,28px)/1.45 var(--disp)}
html[lang="th"] .label .count{font:600 12px/1 var(--h)}
html[lang="th"] .btn{font:600 16px/1.3 var(--disp);padding:0 22px}
html[lang="th"] .intake h2{font:600 21px/1.45 var(--disp)}
html[lang="th"] .contact h2{font:600 clamp(24px,3.6vw,30px)/1.4 var(--disp)}
html[lang="th"] .past>summary b{font:600 20px/1.4 var(--disp)}
html[lang="th"] .kicker,html[lang="th"] .chip,html[lang="th"] .cd-h,html[lang="th"] .box .k,html[lang="th"] .cc .no,html[lang="th"] .sh,html[lang="th"] .concl b,html[lang="th"] .who .r,html[lang="th"] .orgs-t,html[lang="th"] .bro .ed,html[lang="th"] .cert .k{font-family:var(--disp);font-weight:600;letter-spacing:0}
html[lang="th"] *{letter-spacing:0!important}
body.has-sticky{padding-bottom:0}
body.has-sticky footer .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.kicker{border-radius:18px}
@media (min-width:820px){.hero .wrap{padding-top:72px;padding-bottom:80px}body.has-sticky footer .wrap{padding-bottom:30px}}
@media (prefers-reduced-motion:reduce){.sticky,.bro,.pt img{transition:none}}

/* =====================================================================
   BANNER LAYER: same family as the CREST 2026 roll-up banner (diagonal gradient,
   white logo band over an orange rule, condensed uppercase headings, peach accents,
   white rules) in the course's blue, on top of the rounded, pill-button layout.
   ===================================================================== */

      free:"ฟรีค่าลงทะเบียน",register:"ลงทะเบียน",details:"รายละเอียดโครงการ",regSoon:"ลิงก์ลงทะเบียนเร็ว ๆ นี้",regClosed:"ปิดรับสมัครแล้ว",

      pInfo:"ข้อมูลโครงการ",pOut:"ผลลัพธ์สำคัญ",pImpact:"การพัฒนาสมรรถนะและผลลัพธ์สำคัญ",pConcl:"สรุป",pPhotos:"ภาพกิจกรรมการอบรม",
      cHd:"สอบถามและลงทะเบียน",cRole:"ผู้ประสานงาน",phone:"โทร.",tel:"โทร.",cert:"ประกาศนียบัตร",stickyT:"ฟรีค่าลงทะเบียน",kOn:"ออนไลน์",kOff:"ภาคปฏิบัติ"}
  };
  var MS={en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
          th:["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."]};
  var ML={en:["January","February","March","April","May","June","July","August","September","October","November","December"],
          th:["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"]};
  var ARROW='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="square" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg>';
  var BACK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>';
  var TICK='<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" fill="#1D4BB5"/><path d="M5.5 11.5l3.8 3.8 7.2-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="square"/></svg>';

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function t(o){if(o==null)return"";return typeof o==="string"?o:(o[lang]||o.en||o.th||"")}
  function safeUrl(u){u=String(u||"").trim();return/^(https?:\/\/|\.\.?\/|\/|[A-Za-z0-9_-]+\.(png|jpe?g|webp|svg|gif)$)/i.test(u)?u:""}
  function pad(n){return(n<10?"0":"")+n}
  var lang="en",stored=null;
  try{stored=localStorage.getItem("acro-go-lang")}catch(e){}
  var q=new URLSearchParams(location.search).get("lang");
  if(q==="th"||q==="en")lang=q;else if(stored)lang=stored;

  /* ---- dates: stored as YYYY-MM-DD (Christian era), shown as Buddhist era in Thai ---- */
  function P(s){var a=String(s).split("-");return{y:+a[0],m:+a[1],d:+a[2]}}
  function Y(y){return lang==="th"?y+543:y}
  function M(m,full){return(full?ML:MS)[lang][m-1]}
  function range(a,b,full){
    if(!a)return"";var s=P(a);
    if(!b||b===a)return s.d+" "+M(s.m,full)+" "+Y(s.y);
    var e=P(b);
    if(s.y===e.y)return s.d+" "+M(s.m,full)+" – "+e.d+" "+M(e.m,full)+" "+Y(e.y);
    return s.d+" "+M(s.m,full)+" "+Y(s.y)+" – "+e.d+" "+M(e.m,full)+" "+Y(e.y);
  }
  function num(s){var p=P(s);return p.y*10000+p.m*100+p.d}
  function todayNum(){var d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
  function days(y,m,d){return Date.UTC(y,m-1,d)/864e5}

  /* ---- Thailand time (UTC+7), whatever the visitor's own time zone ---- */
  function bkk(s,endOfDay){
    var m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/);if(!m)return NaN;
    var hasT=m[4]!=null,h=hasT?+m[4]:(endOfDay?23:0),mi=hasT?+m[5]:(endOfDay?59:0),sec=endOfDay?59:0;
    return Date.UTC(+m[1],+m[2]-1,+m[3],h-7,mi,sec);
  }
  function closeAt(e){return e&&e.registerCloses?bkk(e.registerCloses,true):NaN}

  function seatsOf(e,c){return c&&c.seats!=null?c.seats:e.seatsPerCohort}
  function status(e){return e.status==="open"||e.status==="soon"||e.status==="closed"?e.status:"past"}
  /* effective status: an open intake closes by itself when its registerCloses time passes */
  function eff(e){var s=status(e);if(s==="open"){var c=closeAt(e);if(isFinite(c)&&Date.now()>=c)return"closed"}return s}
  function cohortState(c){var n=todayNum();return n<num(c.start)?"upcoming":(n>num(c.end)?"done":"running")}
  function cohortWord(i){return lang==="th"?UI.th.cohort+" "+i:UI.en.cohort+" "+i}

  function regBtn(e,cls,withArrow){
    if(e&&eff(e)==="closed")return'<span class="btn off">'+esc(UI[lang].regClosed)+'</span>';
    var url=safeUrl(e&&e.register);
    if(url)return'<a class="btn '+cls+'" href="'+esc(url)+'" rel="noopener">'+esc(UI[lang].register)+(withArrow?' '+ARROW:'')+'</a>';
    return'<span class="btn off">'+esc(UI[lang].regSoon)+'</span>';
  }

  var eds=(D.editions||[]).slice();
  var cur=eds.filter(function(e){return status(e)!=="past"})[0]||null;
  var past=eds.filter(function(e){return status(e)==="past"});

  /* ---- countdown ---- */
  var cdT=null;
  function cdPlan(){
    cdT=null;if(!cur)return;
    var st=eff(cur),c=closeAt(cur);
    if(st==="open"){
      if(isFinite(c)){cdT={kind:"close",t:c,done:false};return}
      var cs=cur.cohorts||[];
      for(var i=0;i<cs.length;i++){var s=bkk(cs[i].start,false);if(isFinite(s)&&s>Date.now()){cdT={kind:"start",t:s,n:i+1,done:false};return}}
    }else if(st==="closed"&&isFinite(c)){cdT={kind:"close",t:c,done:true}}
  }
  function parts(ms){var s=Math.max(0,Math.floor(ms/1000));return[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60]}
  function cdHtml(){
    if(!cdT)return"";
    var u=UI[lang],p=parts(cdT.done?0:cdT.t-Date.now());

    var h='<div class="cd'+(cdT.done?" closed":"")+'" id="cd" role="timer"><div class="cd-h"><i class="beep'+(cdT.done?" off":"")+'" aria-hidden="true"></i><span>'+esc(label)+'</span></div><div class="cd-g">';
    [[0,u.dD],[1,u.dH],[2,u.dM],[3,u.dS]].forEach(function(x){h+='<div><b data-p="'+x[0]+'">'+pad(p[x[0]])+'</b><small>'+esc(x[1])+'</small></div>'});
    h+='</div>';
    if(cdT.kind==="close"){
      var m=String(cur.registerCloses).match(/^(\d{4}-\d{2}-\d{2})(?:[ T](\d{1,2}):(\d{2}))?/),tm=m&&m[2]!=null?pad(+m[2])+":"+m[3]:"23:59";
      if(m)h+='<p class="cd-n">'+esc(u.closesOn+" "+range(m[1],null,true)+u.atTime+tm+u.tz)+'</p>';
    }
    return h+'</div>';
  }
  function tick(){
    if(!cdT||cdT.done)return;
    var ms=cdT.t-Date.now();
    if(ms<=0){render();return}
    var el=document.getElementById("cd"),p=parts(ms);if(!el)return;
    el.querySelectorAll("b[data-p]").forEach(function(b){var v=pad(p[+b.dataset.p]);if(b.textContent!==v)b.textContent=v});
  }

  function hero(){
    var pg=D.page||{},f=D.format||{};
    document.getElementById("h-kicker").textContent=t(pg.kicker);
    document.getElementById("h-title").innerHTML=(function(x){return x.indexOf("|")<0?esc(x):x.split("|").map(function(a){return'<span class="nw">'+esc(a)+"</span>"}).join("<wbr>")})(t(pg.title))+(pg.tag?' <span class="bang"><b>'+esc(pg.tag)+'</b></span>':"");
    document.getElementById("h-sub").textContent=t(pg.subtitle);
    document.getElementById("h-tag").textContent=t(pg.tagline);

    if(f.online)fx.push([f.online.weeks,u.fOn]);
    if(f.onsite)fx.push([f.onsite.weeks,u.fOff]);

    var cta="",st=cur?eff(cur):"";
    if(cur&&(st==="open"||st==="closed")){cta=regBtn(cur,"white",true);var du=safeUrl(cur.detailsUrl);if(du)cta+='<a class="btn ghost" href="'+esc(du)+'" rel="noopener">'+esc(u.details)+'</a>'}
    document.getElementById("h-cta").innerHTML=cta;

    }else{
      h='<span class="chip '+(st==="open"?"":st)+'"><i></i>'+esc(u[st])+'</span><h2>'+esc(t(cur.label))+'</h2>'+cdHtml();
      (cur.cohorts||[]).forEach(function(c,i){
        h+='<div class="irow'+(i===0?" first":"")+(i%2?" alt":"")+'"><span class="n">'+pad(i+1)+'</span><span class="d">'+esc(range(c.start,c.end,false))+'</span><span class="s">'+esc(cohortWord(i+1))+
           (seatsOf(cur,c)!=null?' · '+esc(seatsOf(cur,c))+' '+esc(u.seats):'')+'</span></div>';
      });
      if(cur.free&&st!=="closed")h+='<span class="free">'+esc(u.free)+'</span>';
    }
    box.innerHTML=h;
  }

  /* ---- partner logos ---- */
  function orgs(){
    var list=(D.partners||[]),box=document.getElementById("orgs");

  /* ---- timeline of the current intake's cohorts ---- */
  function timeline(e){
    var cs=(e.cohorts||[]).filter(function(c){return c.start&&c.end});if(!cs.length)return"";
    var ss=cs.map(function(c){return c.start}).sort(),ee=cs.map(function(c){return c.end}).sort();
    var a=P(ss[0]),b=P(ee[ee.length-1]);
    var t0=days(a.y,a.m,1),nx=b.m===12?[b.y+1,1]:[b.y,b.m+1],t1=days(nx[0],nx[1],1),span=t1-t0;
    var axis="",grid="",y=a.y,m=a.m;
    while(days(y,m,1)<t1){
      var s=days(y,m,1),n=m===12?[y+1,1]:[y,m+1],en=days(n[0],n[1],1);
      var L=(s-t0)/span*100,W=(en-s)/span*100;
      axis+='<div class="m" style="left:'+L.toFixed(3)+'%;width:'+W.toFixed(3)+'%">'+esc(M(m))+((m===a.m&&y===a.y)||m===1?'<small>'+esc(Y(y))+'</small>':'')+'</div>';
      grid+='<div class="g" style="left:'+L.toFixed(3)+'%"></div>';
      y=n[0];m=n[1];
    }
    var bars=cs.map(function(c,i){
      var s=P(c.start),en=P(c.end),L=(days(s.y,s.m,s.d)-t0)/span*100,W=(days(en.y,en.m,en.d)+1-days(s.y,s.m,s.d))/span*100;
      return'<div class="bar cl-'+(i%4)+'" style="left:'+L.toFixed(3)+'%;width:'+W.toFixed(3)+'%;top:'+(i*46)+'px"><b>'+esc(cohortWord(i+1))+'</b></div>';
    }).join("");
    return'<div class="tl"><div class="axis">'+axis+'</div><div class="lanes" style="height:'+(cs.length*46)+'px">'+grid+bars+'</div></div>';
  }

  function section(title,inner,cnt){return'<section class="sec" id="sec-'+cnt+'"><div class="label"><span>'+esc(title)+'</span><span class="count">'+pad(cnt)+'</span></div>'+inner+'</section>'}

  function pastBlock(e,openIt){
    var u=UI[lang],h='<details class="past"'+(openIt?" open":"")+'><summary><b>'+esc(t(e.label))+'</b><span>'+esc(range((e.period||{}).start,(e.period||{}).end,true))+
      (e.cohortCount?' · '+esc(e.cohortCount)+' '+esc(UI[lang].fCo):'')+'</span></summary><div class="pb">';
    if(e.stats&&e.stats.length){
      h+='<div><div class="sh">'+esc(u.pOut)+'</div><div class="stats">'+e.stats.map(function(s){
        return'<div class="stat '+esc(s.tone==="orange"||s.tone==="green"?s.tone:"")+'"><b>'+esc(s.value)+'</b><span class="lb">'+esc(t(s.label))+'</span>'+(s.sub?'<span class="sb">'+esc(t(s.sub))+'</span>':'')+'</div>';
      }).join("")+'</div></div>';
    }
    var left="",right="";
    if(e.info&&e.info.length)left='<div><div class="sh">'+esc(u.pInfo)+'</div><dl class="info">'+e.info.map(function(r){
      var v=r.range?range(r.range.start,r.range.end,true):t(r.value);return'<div><dt>'+esc(t(r.label))+'</dt><dd>'+esc(v)+'</dd></div>'}).join("")+'</dl></div>';
    if(e.highlights&&e.highlights.length)right='<div><div class="sh">'+esc(u.pImpact)+'</div><ul class="ticks">'+e.highlights.map(function(x){return'<li>'+TICK+'<span>'+esc(t(x))+'</span></li>'}).join("")+'</ul></div>';
    if(left||right)h+='<div class="pcols">'+left+right+'</div>';
    if(e.photos&&e.photos.length){
      h+='<div><div class="sh">'+esc(u.pPhotos)+'</div><div class="gal">'+e.photos.map(function(p){var s=safeUrl(p.src);return s?'<img src="'+esc(s)+'" alt="'+esc(t(p.alt))+'" loading="lazy">':""}).join("")+'</div></div>';
    }
    if(e.conclusion)h+='<div class="concl"><b>'+esc(u.pConcl)+'</b>'+esc(t(e.conclusion))+'</div>';
    return h+'</div></details>';
  }

  /* ---- brochures: every intake's brochures, newest first, opened in a pop-up viewer ---- */
  var BRO=[];
  function brochures(){
    var u=UI[lang];BRO=[];
    eds.forEach(function(e){(e.brochures||[]).forEach(function(b){var s=safeUrl(b.src);if(s)BRO.push({src:s,w:b.w,h:b.h,title:t(b.title),alt:t(b.alt)||t(b.title),ed:t(e.label)})})});
    if(!BRO.length)return"";
    return'<div class="bros">'+BRO.map(function(b,i){
      return'<article class="bro"><button type="button" class="thumb" data-bro="'+i+'" aria-label="'+esc(u.view+": "+b.title)+'"><img src="'+esc(b.src)+'"'+(b.w&&b.h?' width="'+esc(b.w)+'" height="'+esc(b.h)+'"':'')+' alt="'+esc(b.alt)+'" loading="lazy"></button>'+
        '<div class="bt"><span class="ed">'+esc(b.ed)+'</span><span class="bn">'+esc(b.title)+'</span><div class="ba"><button type="button" class="lnk" data-bro="'+i+'">'+esc(u.view)+'</button><a class="lnk" href="'+esc(b.src)+'" download>'+esc(u.dl)+'</a></div></div></article>';
    }).join("")+'</div>';
  }

  function body(){
    var u=UI[lang],f=D.format||{},pg0=D.page||{},h="",n=0,bro;
    if(f.online||f.onsite){
      n++;
      h+=section(u.sFormat,'<div class="fmt">'+
        (f.online?'<div class="box on"><div class="k">'+esc(u.kOn)+'</div><div class="big"><b>'+esc(f.online.weeks)+'</b><span>'+esc(u.weeks)+'</span></div><p>'+esc(t(f.online.label))+'</p></div>':'')+
        '<div class="plus" aria-hidden="true">+</div>'+
        (f.onsite?'<div class="box off"><div class="k">'+esc(u.kOff)+'</div><div class="big"><b>'+esc(f.onsite.weeks)+'</b><span>'+esc(u.weeks)+'</span></div><p>'+esc(t(f.onsite.label))+'</p></div>':'')+
        '</div>'+(pg0.certificate?'<div class="cert"><span class="k">'+esc(u.cert)+'</span><b>'+esc(t(pg0.certificate))+'</b></div>':''),n);
    }
    if(cur&&(cur.cohorts||[]).length){
      n++;
      h+=section(u.sSchedule,'<p class="note">'+esc(t(cur.label))+'</p>'+timeline(cur)+'<div class="cgrid">'+cur.cohorts.map(function(c,i){
        var st=cohortState(c),sn=seatsOf(cur,c);
        return'<div class="cc cl-'+(i%4)+'"><span class="no">'+esc(cohortWord(i+1))+'</span><span class="dt">'+esc(range(c.start,c.end,true))+'</span><span class="meta">'+
          (sn!=null?'<span>'+esc(sn)+' '+esc(u.seats)+'</span>':'')+'<span class="badge '+(st==="running"?"run":st==="done"?"done":"")+'">'+esc(u[st])+'</span></span></div>';
      }).join("")+'</div>',n);
    }
    bro=brochures();
    if(bro){n++;h+=section(u.sBro,bro,n)}
    if((D.sites||[]).length){
      n++;
      h+=section(u.sSites,'<div class="list">'+D.sites.map(function(s,i){return'<div class="card"><span class="num">'+pad(i+1)+'</span><span class="ttl">'+esc(t(s))+'</span></div>'}).join("")+'</div>',n);
    }
    if(D.objectives&&(D.objectives.items||[]).length){
      n++;
      h+=section(u.sObj,(D.objectives.note?'<p class="note">'+esc(t(D.objectives.note))+'</p>':'')+'<div class="list">'+D.objectives.items.map(function(s,i){return'<div class="card blue"><span class="num">'+pad(i+1)+'</span><span class="ttl">'+esc(t(s))+'</span></div>'}).join("")+'</div>',n);
    }
    if(past.length){
      n++;
      h+=section(u.sPast,past.map(function(e,i){return pastBlock(e,i===0)}).join(""),n);
    }
    document.getElementById("body").innerHTML=h;
  }

  /* office line(s): phones[0] is a full number, later entries without + reuse its area code */
  function office(o,u){
    if(!o)return"";
    var h='<hr class="sep"><span class="r">'+esc(t(o.role))+'</span>',ph=o.phones||[];
    if(ph.length){
      var first=String(ph[0]).replace(/[^0-9+]/g,""),pre=first.replace(/\d{6}$/,"");
      h+='<span class="tel"><span>'+esc(u.tel)+'</span>'+ph.map(function(n,i){
        var d=String(n).replace(/[^0-9+]/g,""),full=d.charAt(0)==="+"||d.length>6?d:pre+d;
        return'<a href="tel:'+esc(full)+'">'+esc(n)+'</a>'+(i<ph.length-1?'<span class="c">,</span>':'');
      }).join("")+'</span>';
    }
    if(o.email)h+='<a href="mailto:'+esc(o.email)+'">'+esc(o.email)+'</a>';
    return h;
  }
  function contact(){
    var u=UI[lang],c=D.contact||{},pg=D.page||{};
    var h='<div><h2>'+esc(u.cHd)+'</h2>'+(pg.organizer?'<p class="org">'+esc(t(pg.organizer))+'</p>':'')+'</div>';
    if(c.name||c.phone||c.email){
      h+='<div class="who"><span class="r">'+esc(t(c.role)||u.cRole)+'</span><span class="nm">'+esc(t(c.name))+'</span>'+
        (c.phone?'<a href="tel:'+esc(String(c.phone).replace(/[^0-9+]/g,""))+'">'+esc(u.phone)+' '+esc(String(c.phone).replace(/^(\d{3})(\d{3})(\d{4})$/,"$1-$2-$3"))+'</a>':'')+
        (c.email?'<a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>':'')+office(c.office,u)+'</div>';
    }
    var st=cur?eff(cur):"";
    if(cur&&(st==="open"||st==="closed")){
      var du=safeUrl(cur.detailsUrl);
      h+='<div class="cta">'+regBtn(cur,"orange",true)+(du?'<a class="btn ghost" href="'+esc(du)+'" rel="noopener">'+esc(u.details)+'</a>':'')+'</div>';
    }
    document.getElementById("contact-in").innerHTML=h;
  }

  function sticky(){
    var el=document.getElementById("sticky"),u=UI[lang];
    if(cur&&eff(cur)==="open"&&safeUrl(cur.register)){
      el.hidden=false;document.body.classList.add("has-sticky");
      el.innerHTML='<span class="t">'+esc(t(cur.label))+(cur.free?'<br>'+esc(u.stickyT):'')+'</span>'+regBtn(cur,"",true);
    }else{el.hidden=true;document.body.classList.remove("has-sticky")}
  }

  function render(){
    document.documentElement.lang=lang;
    document.getElementById("back").innerHTML=BACK+'<span>'+esc(UI[lang].back).replace(/^ACRO KKU /,'<b class="go-full">ACRO KKU </b>')+'</span>';
    document.getElementById("back").setAttribute("aria-label",UI[lang].backFull);
    document.getElementById("back").setAttribute("title",UI[lang].backFull);
    document.getElementById("back").href="../?lang="+lang;
    document.title=t((D.page||{}).title).replace(/\|/g,"")+" ("+((D.page||{}).tag||"CRN")+") · ACRO KKU";
    document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.lang===lang))});
    hero();orgs();body();contact();sticky();secnav();
  }
  /* ---- on-this-page chips, built from the section headings ---- */
  var navIO=null;
  function secnav(){
    var box=document.getElementById("secnav-in"),secs=[].slice.call(document.querySelectorAll("#body .sec"));
    document.getElementById("secnav").hidden=secs.length<3;
    box.innerHTML=secs.map(function(s){var l=s.querySelector(".label span");return'<a href="#'+s.id+'">'+esc(l?l.textContent:"")+'</a>'}).join("");
    if(navIO)navIO.disconnect();
    if(!("IntersectionObserver" in window))return;
    navIO=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;
      box.querySelectorAll("a").forEach(function(a){var on=a.getAttribute("href")==="#"+e.target.id;a.classList.toggle("on",on);if(on&&a.scrollIntoView&&box.scrollWidth>box.clientWidth)box.scrollTo({left:a.offsetLeft-box.clientWidth/3,behavior:"smooth"})})})},{rootMargin:"-40% 0px -55% 0px"});
    secs.forEach(function(s){navIO.observe(s)});
  }
  /* the sticky register bar slides in only after the hero buttons have scrolled out of view */
  if("IntersectionObserver" in window){
    new IntersectionObserver(function(es){document.getElementById("sticky").classList.toggle("show",!es[0].isIntersecting&&es[0].boundingClientRect.top<0)}).observe(document.getElementById("h-cta"));
  }else document.getElementById("sticky").classList.add("show");

  /* ---- brochure viewer ---- */
  var dlg=document.getElementById("lb");
  document.addEventListener("click",function(ev){
    var tg=ev.target,b=tg.closest?tg.closest("[data-bro]"):null;
    if(b){
      var it=BRO[+b.getAttribute("data-bro")];if(!it)return;
      if(!dlg||!dlg.showModal){window.open(it.src,"_blank");return}
      document.getElementById("lb-img").src=it.src;document.getElementById("lb-img").alt=it.alt;
      document.getElementById("lb-t").textContent=it.title;
      var dl=document.getElementById("lb-dl");dl.href=it.src;dl.textContent=UI[lang].dl;
      document.getElementById("lb-x").setAttribute("aria-label",UI[lang].x);
      dlg.showModal();return;
    }
    if(dlg&&dlg.open&&(tg===dlg||(tg.closest&&tg.closest("#lb-x"))))dlg.close();
  });

  document.querySelectorAll(".lang button").forEach(function(btn){
    btn.addEventListener("click",function(){lang=btn.dataset.lang;try{localStorage.setItem("acro-go-lang",lang)}catch(e){}render()});
  });
  render();
  setInterval(tick,1000);
})();
</script>
</body>
</html>
