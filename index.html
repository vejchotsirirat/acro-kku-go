<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACRO KKU Go!</title>
<meta name="description" content="ACRO KKU Go! Forms, events and updates from the Academic Clinical Research Office, Khon Kaen University.">
<meta name="theme-color" content="#215E33">
<meta name="color-scheme" content="light">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:title" content="ACRO KKU Go!">
<meta property="og:description" content="Forms, events and updates from ACRO KKU.">
<meta property="og:image" content="acro-logo.png">
<link rel="preload" href="bsd-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="manrope-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Files sit next to this page (no folders), exactly as they are in the GitHub repository. */
@font-face{font-family:"BSD";src:url(bsd-800.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Manrope";src:url(manrope-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Manrope";src:url(manrope-600.woff2) format("woff2");font-weight:500 600;font-display:swap}
@font-face{font-family:"Manrope";src:url(manrope-700.woff2) format("woff2");font-weight:700 800;font-display:swap}
@font-face{font-family:"PlexThai";src:url(plexthai-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"PlexThai";src:url(plexthai-600.woff2) format("woff2");font-weight:500 600;font-display:swap}
@font-face{font-family:"PlexThai";src:url(plexthai-700.woff2) format("woff2");font-weight:700 800;font-display:swap}

:root{
  --night:#0B2416;--forest:#215E33;--emerald:#16944F;--mint:#7FD8A4;--orange:#F0702F;--ember:#E8472B;--peach:#FFD3B8;
  --ink:#0F2A1A;--body:#3D4C43;--muted:#6B7A70;--line:rgba(15,42,26,.10);--paper:#F7F8F5;--card:#fff;
  --r-lg:24px;--r-md:16px;--shadow:0 1px 2px rgba(15,42,26,.06),0 8px 24px rgba(15,42,26,.06);
  --shadow-hi:0 2px 4px rgba(15,42,26,.06),0 24px 48px rgba(15,42,26,.14);
  --sans:"Manrope","PlexThai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--paper);scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
html[lang="th"] body{font-family:"PlexThai","Manrope",system-ui,sans-serif;line-height:1.7}
/* Thai: never track or upper-case (it pulls vowels and tone marks apart) */
html[lang="th"] *{letter-spacing:0!important;text-transform:none!important}
html[lang="th"] .go,html[lang="th"] .go *{text-transform:uppercase!important}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left))}
.nb{white-space:nowrap}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line)}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--forest),var(--emerald) 45%,var(--orange) 85%,var(--ember))}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{height:34px;width:auto;display:block}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;background:var(--night);isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);pointer-events:none}
.hero::before{width:620px;height:620px;left:-200px;top:-260px;background:radial-gradient(circle,rgba(22,148,79,.85),rgba(22,148,79,0) 70%);animation:drift 18s ease-in-out infinite alternate}
.hero::after{width:560px;height:560px;right:-220px;bottom:-280px;background:radial-gradient(circle,rgba(240,112,47,.75),rgba(232,71,43,0) 70%);animation:drift 22s ease-in-out infinite alternate-reverse}
.hero .grid{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1.2px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 85%);mask-image:linear-gradient(180deg,#000 0%,transparent 85%)}
.hero .orbit{position:absolute;z-index:-1;pointer-events:none;right:-120px;top:50%;width:720px;height:720px;transform:translateY(-50%);border-radius:50%;opacity:.5;
  background:repeating-radial-gradient(circle,transparent 0 79px,rgba(255,255,255,.07) 80px 81px);-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%);mask-image:radial-gradient(circle,#000 30%,transparent 70%)}
@media (max-width:819px){.hero .orbit{display:none}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,40px) scale(1.12)}}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;padding-top:36px;padding-bottom:44px}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;line-height:1.35;color:rgba(255,255,255,.78);
  padding:7px 14px 7px 10px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.06);backdrop-filter:blur(6px)}
.kicker::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(127,216,164,.18)}
.go{font:800 clamp(64px,18vw,124px)/.86 "BSD","Manrope",sans-serif;text-transform:uppercase;letter-spacing:.005em;margin-top:18px;white-space:nowrap}
.go .bang{display:inline-block;background:linear-gradient(135deg,var(--orange),var(--ember));color:#fff;padding:0 .12em .02em;margin-left:.06em;
  transform:skewX(-12deg) rotate(-2deg);border-radius:.06em;box-shadow:0 14px 34px rgba(232,71,43,.35)}
.go .bang b{display:inline-block;transform:skewX(12deg);font-weight:800}
.lead{font-size:clamp(17px,2.2vw,20px);font-weight:500;color:rgba(255,255,255,.84);max-width:30em;margin-top:18px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;
  font:700 16px/1.2 var(--sans);text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s}
html[lang="th"] .pill{font-family:"PlexThai","Manrope",sans-serif;font-weight:600}
.pill.primary{background:#fff;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pill.primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,.3)}
.pill .ar{display:grid;place-items:center;width:28px;height:28px;margin-right:-10px;border-radius:50%;background:var(--ink);color:#fff;transition:transform .2s}
.pill:hover .ar{transform:translateX(3px)}

.live{display:inline-grid;grid-template-columns:auto auto;gap:4px 28px;justify-self:start;align-self:start;
  padding:14px 20px 16px;border-radius:var(--r-md);text-decoration:none;color:#fff;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.live .hd{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--peach)}
.live .st b{display:block;font:800 38px/1 "BSD",sans-serif;margin-top:4px}
.live .st span{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.75)}
.live i{width:8px;height:8px;border-radius:50%;background:#FF5A3C;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,60,.7)}100%{box-shadow:0 0 0 10px rgba(255,90,60,0)}}

/* ---------- live globe ---------- */
.globe-box{display:flex;flex-direction:column;align-items:center;gap:10px;order:2}
.live{order:1}
@media (max-width:819px){.globe-chips button:nth-child(n+5){display:none}}
.globe-wrap{position:relative;width:min(100%,280px)}
.globe-wrap::before{content:"";position:absolute;inset:-8%;border-radius:50%;background:radial-gradient(circle,rgba(127,216,164,.22),transparent 65%);z-index:-1}
#globe{width:100%;aspect-ratio:1;display:block;cursor:grab;touch-action:pan-y;border-radius:50%;transition:box-shadow .35s;
  box-shadow:0 30px 80px rgba(0,0,0,.35)}
#globe.zoomed{box-shadow:0 0 0 1.5px rgba(255,255,255,.6),0 30px 80px rgba(0,0,0,.35)}
#globe.locked{touch-action:none}
#globe.dragging{cursor:grabbing}
.globe-zoom{position:absolute;right:-4px;bottom:4px;display:flex;flex-direction:column;gap:6px}
.globe-zoom{isolation:isolate}
.globe-zoom button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(11,36,22,.6);backdrop-filter:blur(8px);color:#fff;
  font:700 17px/1 "Manrope",sans-serif;padding:0;cursor:pointer;display:grid;place-items:center;transition:background .2s}
.globe-zoom button:hover:not(:disabled){background:rgba(11,36,22,.85)}
.globe-zoom button:disabled{opacity:.35;cursor:default}
.globe-zoom #gzreset{font-size:11.5px;letter-spacing:-.02em}
.globe-zoom button:focus-visible{outline:2px solid var(--peach);outline-offset:2px}
.globe-cap{font-size:15px;font-weight:700;line-height:1.35;color:var(--peach);text-align:center;min-height:1.35em;max-width:360px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.seg button{border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.85);font:600 13px/1 var(--sans);height:34px;padding:0 14px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.globe-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:460px}
.globe-chips button{border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.06);color:#fff;font:600 12.5px/1 var(--sans);padding:8px 12px;cursor:pointer}
.globe-chips button[aria-pressed="true"]{background:var(--peach);border-color:var(--peach);color:var(--ink)}
.globe-hint{font-size:12px;font-weight:500;color:rgba(255,255,255,.6);text-align:center}

/* ---------- portal list ---------- */
main{padding:56px 0 64px;flex:1}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.sec-hd h2{font-size:clamp(26px,4vw,34px);font-weight:800;line-height:1.15;letter-spacing:-.025em}
.list{display:grid;gap:16px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;text-decoration:none;color:inherit;
  position:relative;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,border-color .25s;animation:rise .6s cubic-bezier(.2,.7,.2,1) backwards}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(n+4){animation-delay:.22s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
a.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi);border-color:rgba(22,148,79,.35)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:28px}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:#EAF4EE;color:var(--forest);font-size:12px;font-weight:700}
.new{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:#FFF0E7;color:#B4441B;font-size:12px;font-weight:700}
.new::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange)}
.date{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.ttl{font-size:21px;font-weight:800;line-height:1.3;letter-spacing:-.015em;margin-top:6px}
html[lang="th"] .ttl{font-weight:700}
.txt{color:var(--body);font-size:15px;flex:1}
.btn{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;margin-top:10px;height:44px;padding:0 18px 0 20px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:15px;font-weight:700}
.btn svg{transition:transform .2s}
a.card:hover .btn svg{transform:translateX(4px)}
/* the featured portal: same size, dark branded surface */
.card.featured{background:var(--night);color:#fff;border-color:transparent;overflow:hidden;isolation:isolate}
.card.featured::before{content:"";position:absolute;z-index:-1;width:360px;height:360px;right:-140px;top:-160px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,112,47,.7),transparent 68%);filter:blur(30px)}
.card.featured::after{content:"";position:absolute;z-index:-1;width:320px;height:320px;left:-140px;bottom:-180px;border-radius:50%;
  background:radial-gradient(circle,rgba(22,148,79,.8),transparent 68%);filter:blur(30px)}
.card.featured .tag{background:rgba(255,255,255,.12);color:#fff}
.card.featured .tag::before{content:"";width:7px;height:7px;margin-right:7px;border-radius:50%;background:#FF5A3C;animation:pulse 1.6s ease-out infinite}
.card.featured .date{color:rgba(255,255,255,.65)}
.card.featured .txt{color:rgba(255,255,255,.82)}
.card.featured .btn{background:#fff;color:var(--ink)}
.card.soon{opacity:.62}
.card.soon .btn{background:#C9D1CC;color:var(--ink)}
.empty{color:var(--muted);padding:24px 0}

/* ---------- about strip ---------- */
.about{display:grid;gap:14px;margin-top:56px}
.about div{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;padding:20px;border-radius:var(--r-md);background:rgba(255,255,255,.6);border:1px solid var(--line)}
.about svg{grid-row:1/span 2;width:40px;height:40px;padding:9px;border-radius:12px;background:#EAF4EE;color:var(--forest)}
.about b{font-size:16px;font-weight:800;line-height:1.3}
.about span{font-size:14px;color:var(--muted)}

/* ---------- footer ---------- */
footer{background:var(--night);color:#fff}
footer .wrap{padding-top:32px;padding-bottom:calc(32px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px;align-items:flex-end}
footer .names{display:grid;gap:4px;font-size:14px}
footer .names .th{font-family:"PlexThai",sans-serif;font-weight:600;font-size:15px}
footer .names .en{color:rgba(255,255,255,.65)}
footer a.site{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.22);color:#fff;font-weight:700;text-decoration:none;transition:background .2s}
footer a.site:hover{background:rgba(255,255,255,.08)}

@media (min-width:700px){.list{grid-template-columns:1fr 1fr}.about{grid-template-columns:repeat(3,1fr)}.about div{grid-template-columns:1fr}.about svg{grid-row:auto;margin-bottom:8px}}
@media (min-width:1000px){.list{grid-template-columns:repeat(3,1fr)}}
@media (min-width:820px){
  .hero .wrap{grid-template-columns:minmax(0,1fr) minmax(0,440px);align-items:center;gap:24px 48px;padding-top:72px;padding-bottom:80px}
  .hero .text{grid-column:1}
  .live{grid-column:1}
  .globe-box{grid-column:2;grid-row:1/span 2}
  .globe-wrap{width:min(100%,400px,calc(100vh - 320px))}
  .go{font-size:clamp(72px,7.6vw,112px)}
}
@media (prefers-reduced-motion:reduce){.hero::before,.hero::after,.card{animation:none}.live i,.card.featured .tag::before{animation:none}}

/* =====================================================================
   BANNER LAYER: the look of the CREST 2026 roll-up banner (diagonal green-to-orange
   gradient, white logo band over an orange rule, condensed uppercase headings,
   peach accents, white rules) on top of the rounded, pill-button layout.
   ===================================================================== */
@font-face{font-family:"KanitTH";src:url(crn-shortcourse/kanit-thai-600.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:"KanitTH";src:url(crn-shortcourse/kanit-thai-700.woff2) format("woff2");font-weight:700 800;font-display:swap;unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
:root{--grad:linear-gradient(150deg,#215E33 0%,#16944F 52%,#F0702F 80%,#E8472B 100%);--disp:"BSD","Manrope","KanitTH",sans-serif}
.top{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:6px solid var(--orange)}
.top::before{display:none}
.hero{background:var(--grad)}
.hero::before,.hero::after{display:none}
.hero .grid{opacity:.18}
.hero .orbit{opacity:.7;background:none;-webkit-mask-image:none;mask-image:none;border:2px dashed rgba(255,255,255,.3);width:560px;height:560px;right:-160px}
.kicker{padding:0;border:0;background:none;backdrop-filter:none;font:800 15px/1.3 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--peach)}
.kicker::before{display:none}
.lead{font-weight:600;color:#fff}
.pill.primary{color:var(--forest)}
.pill .ar{background:var(--forest)}
/* hero: two start buttons (game above collaborate) */
.cta-hint{display:flex;align-items:center;gap:8px;margin-top:22px;font:800 14px/1.3 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--peach)}
.cta-hint::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-out infinite}
.cta.two{flex-direction:column;align-items:stretch;max-width:420px;margin-top:12px}
.cta.two .pill{justify-content:space-between;min-height:58px;padding:0 24px 0 26px}
.pill.game{background:var(--night);color:#fff;box-shadow:0 10px 30px rgba(11,36,22,.35)}
.pill.game .ar{background:var(--peach);color:var(--night)}
.pill.game:hover{transform:translateY(-2px)}
.pill.game{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 10px 30px rgba(11,36,22,.35),0 0 0 0 rgba(255,211,184,.55)}50%{box-shadow:0 10px 30px rgba(11,36,22,.35),0 0 0 7px rgba(255,211,184,0)}}
.pill .emo{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;font-size:22px;margin-right:2px;background:rgba(255,255,255,.12)}
.pill.primary .emo{background:#EEF5F0}
.pill .lbl{flex:1}
.pill .lbl small{font:600 13px/1.3 var(--sans)!important;text-transform:none!important;letter-spacing:0!important;opacity:.8;margin-top:3px}
html[lang="th"] .pill .lbl small{font-family:"PlexThai","Manrope",sans-serif!important}
.cta.two .pill{padding:0 14px 0 26px;min-height:62px}
@media (prefers-reduced-motion:reduce){.pill.game{animation:none}}
.pill .lbl{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.pill .lbl small{font-size:12.5px;font-weight:600;opacity:.72;margin-top:2px}
.live{background:rgba(255,255,255,.14);border:0;border-left:4px solid var(--peach);border-radius:0 var(--r-md) var(--r-md) 0}
.live .hd{font:800 14px/1 var(--disp);letter-spacing:.1em}
.live .st b{color:#fff}
#globe{box-shadow:0 24px 60px rgba(10,40,20,.35)}
.globe-cap{font:800 16px/1.3 var(--disp);letter-spacing:.06em;text-transform:uppercase}
.seg{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4)}
.seg button[aria-pressed="true"]{background:var(--peach);color:var(--forest)}
.sec-hd{border-top:4px solid var(--ink);padding-top:12px}
.sec-hd h2{font:800 clamp(30px,5vw,40px)/1 var(--disp);letter-spacing:.01em;text-transform:uppercase;color:var(--forest)}
.card{border-bottom:6px solid var(--orange)}
.ttl{font:800 25px/1.02 var(--disp);letter-spacing:.01em;text-transform:uppercase;color:var(--forest)}
.tag{background:#EAF4EE;color:var(--forest)}
.btn{background:var(--forest)}
.card.featured{background:var(--grad);border-bottom-color:#fff}
.card.featured::before,.card.featured::after{display:none}
.card.featured .ttl{color:#fff;font-size:30px}
.card.featured .txt{color:#fff;font-weight:600}
.card.featured .date{color:rgba(255,255,255,.85)}
.card.featured .btn{color:var(--forest)}
.about div{background:none;border:0;border-top:4px solid var(--forest);border-radius:0;padding:14px 0 0}
.about b{font:800 20px/1.05 var(--disp);letter-spacing:.02em;text-transform:uppercase;color:var(--forest)}
.about svg{background:#EAF4EE}
footer{background:var(--forest);border-top:6px solid var(--orange)}
html[lang="th"] .kicker,html[lang="th"] .live .hd,html[lang="th"] .globe-cap,html[lang="th"] .sec-hd h2,html[lang="th"] .ttl,html[lang="th"] .about b{font-family:"KanitTH","PlexThai",sans-serif;font-weight:600;line-height:1.4}

/* auto-rotate switch under the globe */
.spin{display:inline-flex;align-items:center;gap:9px;height:36px;padding:0 14px 0 8px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);
  color:#fff;font:600 13px/1 var(--sans);cursor:pointer;transition:background .2s}
.spin:hover{background:rgba(255,255,255,.2)}
.spin i{position:relative;width:34px;height:20px;border-radius:99px;background:rgba(0,0,0,.25);transition:background .2s;flex:none}
.spin i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.spin[aria-pressed="true"] i{background:var(--orange)}
.spin[aria-pressed="true"] i::after{transform:translateX(14px)}
.crest-live{display:inline-flex;align-items:center;gap:10px;padding:9px 16px 9px 13px;border-radius:999px;background:rgba(11,36,22,.55);border:1.5px solid var(--peach);
  font:800 15px/1.2 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-align:center;box-shadow:0 8px 24px rgba(11,36,22,.25)}
.crest-live i{flex:none;width:9px;height:9px;border-radius:50%;background:#FF5A3C;animation:pulse 1.6s ease-out infinite}
.crest-live span b{color:var(--peach);font-weight:800}
html[lang="th"] .crest-live{font-family:"PlexThai","Manrope",sans-serif;font-weight:700;font-size:14.5px}
.globe-ctl{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
/* auto-rotate: a small round button above zoom; orange while the globe turns by itself */
.globe-zoom .gspin[data-r="focus"],.globe-zoom .gspin[data-r="spin"]{background:var(--orange);border-color:var(--orange)}
.gmode-tip{position:absolute;right:46px;top:2px;white-space:nowrap;padding:7px 11px;border-radius:999px;background:rgba(15,42,26,.85);color:#fff;font:700 12.5px/1 var(--sans);
  pointer-events:none;opacity:0;transform:translateX(6px);transition:opacity .2s,transform .2s}
.gmode-tip.on{opacity:1;transform:none}
.globe-zoom .gspin svg{display:block}
.pill{font:800 19px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
html[lang="th"] .pill{font:600 17px/1.3 "PlexThai",sans-serif}
.btn{font:800 17px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
html[lang="th"] .btn{font:600 15px/1 "PlexThai",sans-serif}

/* =====================================================================
   ABOUT US: a quick read built from the CREST 2026 roll-up banners (about.js)
   ===================================================================== */
.ab{padding:60px 0 64px}
.ab-kick{display:inline-block;font:800 15px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}
.ab-h{font:800 clamp(36px,6vw,58px)/.95 var(--disp);letter-spacing:.01em;text-transform:uppercase;color:var(--forest);text-wrap:balance}
.ab-sub{font-size:clamp(17px,2vw,19px);font-weight:700;color:var(--emerald);margin-top:12px}
.ab-p{color:var(--body);font-size:16px;margin-top:10px;max-width:38em}
.ab-h3{font:800 22px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--forest);margin:0 0 12px}
.ab-top{display:grid;gap:24px;align-items:center}
/* photos: white frame like the banner; a branded tile with the caption if the file is missing */
.ph{position:relative;margin:0;border:5px solid #fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(15,42,26,.15);
  background:linear-gradient(150deg,#215E33,#16944F 55%,#F0702F);aspect-ratio:16/10;isolation:isolate}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.ph:hover img{transform:scale(1.04)}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 9px;font-size:12px;font-weight:600;line-height:1.35;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:1}
.ph.noimg::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.2px);background-size:16px 16px}
.ph.noimg figcaption{background:none}
.ph:has(img[src$="vision.jpg"]) figcaption{top:0;bottom:auto;padding:9px 12px 22px;background:linear-gradient(rgba(0,0,0,.5),transparent)}
/* what we run: two rows of chips */
.ab-run{display:grid;gap:14px;margin-top:40px}
.ab-box{background:#fff;border:1px solid var(--line);border-bottom:5px solid var(--orange);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 18px 16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips span{display:inline-flex;align-items:center;min-height:34px;padding:5px 13px;border-radius:999px;background:#EEF6F1;color:var(--forest);font-weight:700;font-size:14px;line-height:1.25}
.chips.o span{background:#FFF1E8;color:#9A3A12}
/* services: compact tiles, details on tap */
.ab-svc-h{margin-top:44px}
.svcs{display:grid;gap:12px}
.sv{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:12px;box-shadow:var(--shadow)}
.sv .ph{border:0;border-radius:12px;box-shadow:none;aspect-ratio:1}
.sv .ph figcaption{display:none}
.sv .no{font:800 15px/1 var(--disp);letter-spacing:.06em;color:var(--orange)}
.sv h4{font:800 21px/1.02 var(--disp);letter-spacing:.02em;text-transform:uppercase;color:var(--forest);margin:3px 0 4px}
.sv p{font-size:14.5px;color:var(--body);line-height:1.45}
.sv details{margin-top:6px}
.sv summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--emerald);list-style:none;min-height:32px}
.sv summary::-webkit-details-marker{display:none}
.sv summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.sv details[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.sv details p{color:var(--muted);font-size:14px;margin-top:2px}
/* facilities strip and values */
.ab-fac{margin-top:44px}
.ab-fac .chips{margin-bottom:14px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,70%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:thin}
.strip .ph{scroll-snap-align:start}
.vals{margin-top:34px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding:16px 18px;border-radius:var(--r-md);background:var(--forest);color:#fff}
.vals b{font:800 20px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--peach);margin-right:4px}
.vals span{font-weight:600;font-size:14.5px}
.vals span i{font-style:normal;font-weight:800;color:var(--peach)}
/* work with us + contact: one gradient band */
.ab-work{background:var(--grad);color:#fff;position:relative;overflow:hidden;isolation:isolate;padding:56px 0}
.ab-work::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.18;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.2px);background-size:22px 22px}
.ab-work .ab-h{color:#fff;font-size:clamp(38px,6.6vw,70px)}
.ab-work .ab-sub{color:var(--peach)}
.ab-btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.ab-btns a{display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:0 22px;border-radius:999px;text-decoration:none;font:800 18px/1 var(--disp);letter-spacing:.07em;text-transform:uppercase;transition:transform .2s,background .2s}
.ab-btns a.w{background:#fff;color:var(--forest);box-shadow:0 10px 26px rgba(0,0,0,.2)}
.ab-btns a.w:hover{transform:translateY(-2px)}
.ab-btns a.g{border:1.5px solid rgba(255,255,255,.6);color:#fff}
.ab-btns a.g:hover{background:rgba(255,255,255,.12)}
.ab-addr{margin-top:22px;padding-top:14px;border-top:2px solid rgba(255,255,255,.5);display:grid;gap:4px;font-size:14.5px;font-weight:500;color:rgba(255,255,255,.92)}
.ab-addr a{color:#fff;font-weight:700;white-space:nowrap}
@media (min-width:700px){.ab-run{grid-template-columns:1.4fr 1fr}.svcs{grid-template-columns:1fr 1fr}.strip{grid-auto-columns:calc((100% - 24px)/3)}}
@media (min-width:1000px){.ab{padding:84px 0}.ab-top{grid-template-columns:1.15fr .85fr;gap:56px}.svcs{grid-template-columns:repeat(3,1fr)}.strip{grid-auto-columns:calc((100% - 48px)/5)}.strip .ph{aspect-ratio:4/3}}
/* Thai: Kanit headings, no capitals */
html[lang="th"] .ab-kick{font:600 15px/1.4 "KanitTH","PlexThai",sans-serif}
html[lang="th"] .ab-h{font:700 clamp(30px,5vw,46px)/1.3 "KanitTH","PlexThai",sans-serif}
html[lang="th"] .ab-work .ab-h{font-size:clamp(32px,5.4vw,54px)}
html[lang="th"] .ab-h3,html[lang="th"] .vals b{font:600 20px/1.35 "KanitTH","PlexThai",sans-serif}
html[lang="th"] .sv h4{font:600 19px/1.35 "KanitTH","PlexThai",sans-serif}
html[lang="th"] .sv .no{font-family:"KanitTH","PlexThai",sans-serif}
html[lang="th"] .ab-btns a{font:600 16px/1.2 "KanitTH","PlexThai",sans-serif}
@media (prefers-reduced-motion:reduce){.ph img{transition:none}}

/* ==== ACRO family: header controls, identical on every ACRO KKU Go page ==== */
.lang{display:inline-flex;align-items:center;gap:2px;padding:3px;border:1px solid rgba(15,42,26,.12);border-radius:999px;background:#EEF2EF}
.lang button{appearance:none;border:0;border-radius:999px;background:transparent;color:#4A5A50;font:700 13px/1 "Manrope","PlexThai","IBM Plex Sans Thai",system-ui,sans-serif;
  letter-spacing:0;text-transform:none;min-width:48px;height:36px;padding:0 12px;margin:0;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.lang button[aria-pressed="true"]{background:#fff;color:#0F2A1A;box-shadow:0 1px 2px rgba(15,42,26,.14),0 2px 8px rgba(15,42,26,.08)}
.lang button:hover:not([aria-pressed="true"]){color:#0F2A1A}
.acro-back{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 16px 0 13px;border-radius:999px;border:1px solid rgba(15,42,26,.14);background:#fff;color:#0F2A1A;
  font:700 14px/1 "Manrope","PlexThai","IBM Plex Sans Thai",system-ui,sans-serif;letter-spacing:0;text-transform:none;text-decoration:none;white-space:nowrap;transition:background .2s,border-color .2s}
.acro-back:hover{background:#F3F6F4;border-color:rgba(15,42,26,.28)}
.acro-back svg{width:16px;height:16px;flex:none}
.acro-ctl{display:flex;align-items:center;gap:10px}

/* YouTube video slot in About */
.ab-video{margin:40px 0 0;position:relative;aspect-ratio:16/9;border-radius:28px;overflow:hidden;background:#17482A;box-shadow:0 18px 50px rgba(20,37,27,.18)}
.ab-video .yt,.ab-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;display:block}
.ab-video .yt{cursor:pointer;background:#17482A;color:#fff;text-align:left;font:inherit}
.ab-video .yt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.ab-video .yt:hover img{transform:scale(1.03)}
.yt-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,72,42,.05) 30%,rgba(23,72,42,.85))}
.yt-play{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:#F0702F;display:grid;place-items:center;
  box-shadow:0 0 0 10px rgba(240,112,47,.28),0 12px 30px rgba(0,0,0,.3);transition:transform .2s ease}
.yt-play svg{width:34px;height:34px;fill:#fff;margin-left:5px}
.ab-video .yt:hover .yt-play,.ab-video .yt:focus-visible .yt-play{transform:scale(1.08)}
.ab-video .yt:focus-visible{outline:4px solid #FFD3B8;outline-offset:-4px}
.yt-cap{position:absolute;left:24px;right:24px;bottom:20px;display:grid;gap:4px}
.yt-cap b{font-family:"BSD","Big Shoulders Display",sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(22px,3.4vw,38px);line-height:1}
.yt-cap span{font-size:15px;opacity:.92}

@media (max-width:600px){.ab-video{border-radius:20px;margin-top:28px}.yt-play{width:58px;height:58px;margin:-29px 0 0 -29px;top:40%;box-shadow:0 0 0 7px rgba(240,112,47,.28),0 8px 20px rgba(0,0,0,.3)}.yt-play svg{width:24px;height:24px;margin-left:4px}.yt-cap{left:16px;right:16px;bottom:12px}.yt-cap b{font-size:20px}.yt-cap span{display:none}}
